<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#030303">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <title>Event Check-In | NOCTURNE</title>
  <link rel="icon" href="/assets/images/favicon.png">
  <link rel="stylesheet" href="/assets/css/styles.css">
  <link rel="stylesheet" href="/assets/css/check-in.css">
  <script src="/assets/js/check-in.js" defer></script>
</head>
<body class="checkin-body">
  <main class="checkin-shell">
    <section id="checkin-login" class="checkin-panel">
      <img class="checkin-logo" src="/assets/images/nocturne-logo.webp" alt="NOCTURNE Festival — presented by Wild Ones" width="1536" height="768">
      <p class="section-kicker">Private Operations</p>
      <h1>Event<br>check-in.</h1>
      <p>Authorized Wild Ones staff only.</p>
      <form id="checkin-login-form" class="checkin-form">
        <input name="password" type="password" autocomplete="current-password" placeholder="Check-in password" required>
        <button class="btn" type="submit">Open Scanner →</button>
      </form>
      <p id="checkin-login-status" class="checkin-status" role="status"></p>
    </section>

    <section id="checkin-console" class="checkin-panel checkin-console" hidden>
      <div class="checkin-head">
        <div><p class="section-kicker">NOCTURNE Door</p><h1>Scan ticket.</h1></div>
        <button id="checkin-logout" class="checkin-text-button" type="button">Sign out</button>
      </div>

      <div class="scanner-frame">
        <video id="checkin-video" playsinline muted></video>
        <div class="scanner-target" aria-hidden="true"></div>
      </div>

      <div class="checkin-actions">
        <button id="start-scanner" class="btn" type="button">Start Camera Scanner</button>
        <button id="stop-scanner" class="btn secondary" type="button" hidden>Stop Camera</button>
      </div>

      <p id="scanner-help" class="checkin-help">Camera scanning uses your device's built-in QR detector when available. You can always paste a ticket link below.</p>

      <form id="manual-checkin-form" class="checkin-form manual-checkin-form">
        <label for="ticket-input">Ticket URL or token</label>
        <input id="ticket-input" name="ticket" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Paste scanned ticket URL">
        <button class="btn secondary" type="submit">Validate Ticket</button>
      </form>

      <section id="checkin-result" class="checkin-result" data-state="idle" aria-live="assertive">
        <strong>READY</strong>
        <span>Waiting for a ticket.</span>
      </section>
    </section>
  </main>
</body>
</html>
