[build]
  publish = "site"
  functions = "netlify/functions"
  command = "npm run build"

[functions]
  node_bundler = "esbuild"

[[redirects]]
  from = "https://www.nocturnefestival.com/*"
  to = "https://nocturnefestival.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/api/apply"
  to = "/.netlify/functions/apply"
  status = 200
  force = true

[[redirects]]
  from = "/api/redeem-invite"
  to = "/.netlify/functions/redeem-invite"
  status = 200
  force = true

[[redirects]]
  from = "/api/stripe/webhook"
  to = "/.netlify/functions/stripe-webhook"
  status = 200
  force = true

[[redirects]]
  from = "/api/check-in"
  to = "/.netlify/functions/check-in"
  status = 200
  force = true

[[redirects]]
  from = "/api/admin/create-invites"
  to = "/.netlify/functions/create-invites"
  status = 200
  force = true

[[redirects]]
  from = "/api/admin/auth"
  to = "/.netlify/functions/admin-auth"
  status = 200
  force = true

[[redirects]]
  from = "/api/admin/dashboard"
  to = "/.netlify/functions/admin-dashboard"
  status = 200
  force = true

[[redirects]]
  from = "/api/admin/comp-ticket"
  to = "/.netlify/functions/admin-comp-ticket"
  status = 200
  force = true

[[redirects]]
  from = "/api/admin/approval-email"
  to = "/.netlify/functions/admin-approval-email"
  status = 200
  force = true

[[redirects]]
  from = "/ticket-access/reenter"
  to = "/.netlify/functions/ticket-reentry"
  status = 200
  force = true

[[redirects]]
  from = "/ticket-access/checkout"
  to = "/.netlify/functions/create-checkout"
  status = 200
  force = true

[[redirects]]
  from = "/ticket-access"
  to = "/.netlify/functions/ticket-access"
  status = 200
  force = true

[[redirects]]
  from = "/ticket-confirmed"
  to = "/.netlify/functions/ticket-confirmed"
  status = 200
  force = true

[[redirects]]
  from = "/ticket/qr"
  to = "/.netlify/functions/ticket-qr"
  status = 200
  force = true

[[redirects]]
  from = "/ticket"
  to = "/.netlify/functions/ticket-view"
  status = 200
  force = true

[[redirects]]
  from = "/check-in"
  to = "/check-in.html"
  status = 200

[[redirects]]
  from = "/apply"
  to = "/index.html#apply"
  status = 301

[[redirects]]
  from = "/application-received"
  to = "/application-received.html"
  status = 200

[[redirects]]
  from = "/invite"
  to = "/.netlify/functions/invite-view"
  status = 200
  force = true

[[redirects]]
  from = "/admin"
  to = "/admin.html"
  status = 200

[[redirects]]
  from = "/privacy"
  to = "/privacy.html"
  status = 200

[[redirects]]
  from = "/terms"
  to = "/terms.html"
  status = 200

[[redirects]]
  from = "/conduct"
  to = "/conduct.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(self), microphone=(), geolocation=(), payment=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    Content-Security-Policy = "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; script-src 'self'; connect-src 'self'; form-action 'self' https://checkout.stripe.com; base-uri 'self'; frame-ancestors 'none'; object-src 'none'; upgrade-insecure-requests"

[[headers]]
  for = "/invite*"
  [headers.values]
    Cache-Control = "no-store"
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/ticket-access*"
  [headers.values]
    Cache-Control = "no-store"
    X-Robots-Tag = "noindex, nofollow, noarchive"
    Referrer-Policy = "no-referrer"

[[headers]]
  for = "/ticket-confirmed*"
  [headers.values]
    Cache-Control = "no-store"
    X-Robots-Tag = "noindex, nofollow, noarchive"

[[headers]]
  for = "/ticket*"
  [headers.values]
    Cache-Control = "no-store"
    X-Robots-Tag = "noindex, nofollow, noarchive"

[[headers]]
  for = "/check-in*"
  [headers.values]
    Cache-Control = "no-store"
    X-Robots-Tag = "noindex, nofollow, noarchive"
    Permissions-Policy = "camera=(self), microphone=(), geolocation=(), payment=()"
    Content-Security-Policy = "default-src 'self'; img-src 'self' data: blob:; media-src 'self' blob:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; script-src 'self'; connect-src 'self'; form-action 'self'; base-uri 'self'; frame-ancestors 'none'; object-src 'none'; upgrade-insecure-requests"

[[headers]]
  for = "/admin*"
  [headers.values]
    Cache-Control = "no-store"
    X-Robots-Tag = "noindex, nofollow,noarchive"

[[headers]]
  for = "/application-received*"
  [headers.values]
    Cache-Control = "no-store"
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/api/*"
  [headers.values]
    Cache-Control = "no-store"
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/assets/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
