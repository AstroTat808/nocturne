<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#030303">
  <title>Private Invitation | NOCTURNE Festival</title>
  <meta name="description" content="Redeem a private NOCTURNE Festival invitation.">
  <meta name="robots" content="noindex,nofollow">
  <link rel="icon" href="/assets/images/favicon.png"><link rel="stylesheet" href="/assets/css/styles.css"><script src="/assets/js/app.js" defer></script><script src="/assets/js/invite.js" defer></script>
</head>
<body>
  <header class="site-header scrolled"><a class="brand" href="/"><img src="/assets/images/favicon.png" alt=""><span>NOCTURNE</span></a><nav class="nav"><a href="/">Return Home</a><a href="/#apply">Request Invite</a></nav></header>
  <main class="invite-page">
    <section class="invite-card reveal visible">
      <img class="invite-mark" src="/assets/images/crescent-mark.webp" alt="" width="415" height="315">
      <p class="section-kicker">Private Access</p>
      <h1>Your night<br>begins here.</h1>
      <p>Enter the invitation code provided with your acceptance. Valid codes unlock the private ticket path and may only be redeemed once.</p>
      <form id="invite-form" class="invite-form" method="POST" action="/api/redeem-invite">
        <label class="field"><span style="position:absolute;left:-9999px">Invitation code</span><input name="code" required autocomplete="off" inputmode="text" placeholder="NOC-XXXX-XXXX-XXXX" pattern="NOC-[A-Za-z2-9]{4}-[A-Za-z2-9]{4}-[A-Za-z2-9]{4}"></label>
        <button class="btn" type="submit">Verify Invitation →</button>
      </form>
      <div id="invite-result" class="invite-result" role="status" aria-live="polite"></div>
      <a id="ticket-link" class="btn ticket-link" href="#" rel="noopener noreferrer">Continue to Private Tickets →</a>
      <p style="font-size:.72rem;margin-top:2rem">No invitation yet? <a href="/#apply" style="color:var(--gold-bright)">Request consideration.</a></p>
    </section>
  </main>
</body>
</html>
