name: Verify NOCTURNE build

on:
  push:
    branches: [main, event-day-final-hardening]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Syntax checks
        run: npm run check

      - name: Regression tests
        run: npm test

      - name: Preflight
        run: npm run preflight

      - name: Full production build
        run: npm run build
