[build]
  publish = "site"
  functions = "netlify/functions"
  command = "npm run build"

[functions]
  node_bundler = "esbuild"

[functions."ticket-wallet"]
  included_files = ["netlify/functions/wallet-assets/**"]

[[redirects]]
  from = "https://www.nocturnefestival.com/*"
  to = "https://nocturnefestival.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/api/apply"
  to = "/.netlify/functions/apply"
  status = 200
  force = true

