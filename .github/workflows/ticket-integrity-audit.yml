name: Ticket integrity audit

on:
  push:
    branches:
      - ticket-integrity-audit-20260905

permissions:
  contents: read
  id-token: write
  issues: write
  pull-requests: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Wait for matching Netlify preview and run audit
        shell: bash
        run: |
          set -euo pipefail
          endpoint="https://deploy-preview-26--nocturnefestival.netlify.app/api/internal/ticket-integrity-audit"
          rm -f audit.json
          for attempt in $(seq 1 48); do
            oidc="$(curl -fsS -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=nocturne-ticket-audit" | jq -r '.value')"
            code="$(curl -sS -o audit.json -w '%{http_code}' -H "Authorization: Bearer ${oidc}" "${endpoint}" || true)"
            if [ "${code}" = "200" ] && jq -e '.ok == true' audit.json >/dev/null 2>&1; then
              break
            fi
            if [ "${attempt}" = "48" ]; then
              echo "Audit endpoint did not become ready. Last HTTP status: ${code}" >&2
              if [ -f audit.json ]; then cat audit.json >&2; fi
              exit 1
            fi
            sleep 10
          done

      - name: Produce sanitized audit report
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from collections import Counter
          from pathlib import Path

          data = json.loads(Path('audit.json').read_text())
          s = data.get('summary', {})
          lines = [
              '### NOCTURNE deep ticket integrity audit',
              '',
              f"- Active digital tickets audited: **{s.get('activeTickets', 0)}**",
              f"- Paid: **{s.get('paidTickets', 0)}** · Comp: **{s.get('compTickets', 0)}**",
              f"- Structurally valid ticket records: **{s.get('structurallyValidTickets', 0)} / {s.get('activeTickets', 0)}**",
              f"- Structurally broken ticket records: **{s.get('structurallyBrokenTickets', 0)}**",
              f"- Signed waivers: **{s.get('signedWaivers', 0)}** · Unsigned: **{s.get('unsignedWaivers', 0)}**",
              f"- Ready for first-entry scan now: **{s.get('scanReadyForFirstEntry', 0)}**",
              f"- Unsigned tickets valid except for required waiver: **{s.get('unsignedTicketsOnlyBlockedByWaiver', 0)} / {s.get('unsignedWaivers', 0)}**",
              f"- Already checked in: **{s.get('alreadyCheckedIn', 0)}**",
              f"- Production ticket pages returning 200: **{s.get('ticketPages200', 0)} / {s.get('activeTickets', 0)}**",
              f"- Signed-waiver QR endpoints returning 200: **{s.get('signedQr200', 0)} / {s.get('signedWaivers', 0)}**",
              f"- Unsigned-waiver QR endpoints correctly locked at 403: **{s.get('unsignedQrLocked403', 0)} / {s.get('unsignedWaivers', 0)}**",
              f"- Paid admissions verified against Stripe: **{s.get('paidAdmissionPaymentsVerified', 0)} / {s.get('paidTickets', 0)}**",
              f"- Comp admission records verified: **{s.get('compAdmissionRecordsVerified', 0)} / {s.get('compTickets', 0)}**",
              f"- Tickets with any add-on: **{s.get('ticketsWithAnyAddon', 0)}**",
              f"- Add-on tickets fully verified: **{s.get('addonTicketsFullyVerified', 0)} / {s.get('ticketsWithAnyAddon', 0)}**",
              f"- Six-Drink packages: **{s.get('drinkPackages', 0)}** · production bar lookups verified: **{s.get('drinkPackagesBarLookupVerified', 0)}**",
              f"- Water packages: **{s.get('waterPackages', 0)}** · production entitlement lookups verified: **{s.get('waterPackagesEndpointVerified', 0)}**",
              f"- Late Stay packages: **{s.get('lateStayPackages', 0)}** · production entitlement lookups verified: **{s.get('lateStayPackagesEndpointVerified', 0)}**",
              f"- Overall ticket-record integrity: **{'PASS' if s.get('allTicketRecordsValid') else 'FAIL'}**",
              f"- All paid admission payments verified: **{'PASS' if s.get('allPaidAdmissionsStripeVerified') else 'FAIL'}**",
              f"- All comp admissions verified: **{'PASS' if s.get('allCompAdmissionsInternallyVerified') else 'FAIL'}**",
              f"- All add-on tickets verified: **{'PASS' if s.get('allAddonTicketsFullyVerified') else 'FAIL'}**",
          ]

          error_codes = Counter()
          blocker_codes = Counter()
          warning_codes = Counter()
          for row in data.get('rows', []):
              for issue in row.get('issues', []):
                  severity = issue.get('severity')
                  code = issue.get('code', 'unknown')
                  if severity == 'error': error_codes[code] += 1
                  elif severity == 'blocker': blocker_codes[code] += 1
                  elif severity == 'warning': warning_codes[code] += 1
          if error_codes:
              lines += ['', '**Structural/blocking error codes**']
              lines += [f"- `{code}`: {count}" for code, count in sorted(error_codes.items())]
          if blocker_codes:
              lines += ['', '**Expected scan blockers**']
              lines += [f"- `{code}`: {count}" for code, count in sorted(blocker_codes.items())]
          if warning_codes:
              lines += ['', '**Warning codes**']
              lines += [f"- `{code}`: {count}" for code, count in sorted(warning_codes.items())]

          status_counts = Counter()
          for row in data.get('rows', []):
              if row.get('addons', {}).get('drink'): status_counts[f"drink:{row.get('drinkStatus') or 'missing'}"] += 1
              if row.get('addons', {}).get('water'): status_counts[f"water:{row.get('waterStatus') or 'missing'}"] += 1
              if row.get('addons', {}).get('lateStay'): status_counts[f"lateStay:{row.get('lateStayStatus') or 'missing'}"] += 1
          if status_counts:
              lines += ['', '**Add-on status distribution**']
              lines += [f"- `{name}`: {count}" for name, count in sorted(status_counts.items())]

          Path('audit-comment.md').write_text('\n'.join(lines) + '\n')
          Path('audit-summary.json').write_text(json.dumps({
              'generatedAt': data.get('generatedAt'),
              'summary': s,
              'errorCodes': dict(error_codes),
              'blockerCodes': dict(blocker_codes),
              'warningCodes': dict(warning_codes),
              'addonStatusCounts': dict(status_counts)
          }, indent=2))
          PY
          cat audit-comment.md >> "$GITHUB_STEP_SUMMARY"

      - name: Post sanitized report to audit PR
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/issues/26/comments" --method POST --raw-field "body=$(cat audit-comment.md)"
